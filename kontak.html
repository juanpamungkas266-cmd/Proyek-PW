<div class="page-wrapper">

    <!-- KONTAK -->
    <section class="section">
        <div class="section-inner">

            <div class="section-header">
                <span class="section-label">Reach Out</span>
                <h2 class="section-title">Contact Me</h2>
                <div class="section-divider"></div>
            </div>

            <div class="kontak-grid">

                <!-- FORM -->
                <div>
                    <form class="kontak-form" action="#" method="post">

                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Masukkan email Anda" required>

                        <label for="no_hp">No. WhatsApp</label>
                        <input type="tel" id="no_hp" name="no_hp" placeholder="Contoh: 0812-3456-7890">

                        <label for="subjek">Keperluan</label>
                        <select id="subjek" name="subjek">
                            <option value="">— Pilih Keperluan —</option>
                            <option value="kerjasama">Tawaran Kerjasama</option>
                            <option value="desain">Order Web</option>
                            <option value="kolaborasi">Kolaborasi Konten</option>
                            <option value="lainnya">Lainnya</option>
                        </select>

                        <label for="pesan">Pesan</label>
                        <textarea id="pesan" name="pesan" placeholder="Ceritakan proyek atau kebutuhan Anda..." required></textarea>

                        <button type="submit" class="btn-primary">Kirim Pesan</button>

                    </form>
                </div>

                <!-- INFO -->
                <div>
                    <div class="kontak-info-title">Let's Connect</div>

                    <div class="kontak-info-item">
                        <div class="kontak-info-icon">📸</div>
                        <div>
                            <div class="kontak-info-label">Instagram</div>
                            <div class="kontak-info-value">
                                <a href="https://instagram.com/mfadiljp" target="_blank">@mfadiljp</a>
                            </div>
                        </div>
                    </div>

                    <div class="kontak-info-item">
                        <div class="kontak-info-icon">🎵</div>
                        <div>
                            <div class="kontak-info-label">TikTok</div>
                            <div class="kontak-info-value">
                                <a href="https://tiktok.com/@kamu2169" target="_blank">@kamu2169</a>
                            </div>
                        </div>
                    </div>

                    <div class="kontak-info-item">
                        <div class="kontak-info-icon">✉️</div>
                        <div>
                            <div class="kontak-info-label">Email</div>
                            <div class="kontak-info-value">
                                <a href="mailto:juanpamungkas266@gmail.com">juanpamungkas266@gmail.com</a>
                            </div>
                        </div>
                    </div>

                    <!-- SOSMED BUTTONS -->
                    <div class="sosmed-row">
                        <a href="https://instagram.com/mfadiljp" target="_blank" class="sosmed-btn">Instagram</a>
                        <a href="https://tiktok.com/@kamu2169" target="_blank" class="sosmed-btn">TikTok</a>
                    </div>
                </div>

            </div>
        </div>
